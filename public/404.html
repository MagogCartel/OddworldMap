<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161a" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Oddworld Map</title>
    <!-- Pages serves this file at whatever missing address was asked, so every URL is
     root-absolute — and it depends on nothing that could itself be the missing file -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #14161a;
        color: #d8dbe2;
        text-align: center;
        font:
          15px/1.5 -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        padding: 24px;
      }
      .code {
        margin-top: 14px;
        font-size: 44px;
        color: #8a8f9c;
      }
      h1 {
        margin: 2px 0 10px;
        font-size: 20px;
        color: rgb(232, 163, 61);
      }
      p {
        margin: 0 0 22px;
        color: #8a8f9c;
      }
      a {
        color: rgb(232, 163, 61);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="48" height="48" />
      <div class="code">404</div>
      <h1>This screen isn't on the map</h1>
      <p>Nothing lives at this address: a stale or mistyped link.</p>
      <a href="/">Back to the map</a>
    </main>
  </body>
</html>
